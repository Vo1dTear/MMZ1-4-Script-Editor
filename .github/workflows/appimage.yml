name: Build AppImage

on:
  push:
    branches:
      - main
      - kirigami
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y ca-certificates curl gnupg
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://archive.neon.kde.org/public.key \
            | gpg --dearmor \
            | sudo tee /etc/apt/keyrings/kde-neon.gpg >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/kde-neon.gpg] https://archive.neon.kde.org/user noble main" \
            | sudo tee /etc/apt/sources.list.d/kde-neon.list >/dev/null
          sudo apt update
          sudo apt install -y \
            build-essential \
            cmake \
            extra-cmake-modules \
            kf6-kirigami-dev \
            kf6-kio-dev \
            kf6-qqc2-desktop-style \
            libgl1-mesa-dev \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-tools-dev \
            wget

      - name: Verify Qt installation
        run: |
          qmake6 --version

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Download linuxdeploy
        run: |
          mkdir -p packaging/linuxdeploy

          wget -O packaging/linuxdeploy/linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage

          wget -O packaging/linuxdeploy/linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage

          chmod +x packaging/linuxdeploy/*.AppImage

      - name: Build AppImage
        run: |
          chmod +x packaging/appimage.sh
          ./packaging/appimage.sh

      - name: Smoke test in clean Ubuntu (no system Qt or KDE)
        run: |
          docker run --rm \
            -v "$PWD:/work:ro" \
            ubuntu:24.04 bash -ec '
              apt-get update
              apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core
              export APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software
              timeout 30s /work/MMZScriptEditor.AppImage --smoke-test
            '

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: AppImage
          path: MMZScriptEditor.AppImage
          if-no-files-found: error

name: Build AppImage

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    if: github.event.release.target_commitish == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release tag belongs to main
        shell: bash
        run: git merge-base --is-ancestor HEAD origin/main

      - name: Install system dependencies
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y ca-certificates curl gnupg
          sudo install -d -m 0755 /etc/apt/keyrings
          # Retry temporary server errors before attempting to import the key.
          curl --fail --show-error --location \
            --retry 5 --retry-delay 5 --retry-max-time 180 \
            --connect-timeout 20 --max-time 60 \
            --output "$RUNNER_TEMP/kde-neon-public.key" \
            https://archive.neon.kde.org/public.key
          gpg --batch --yes --dearmor \
            --output "$RUNNER_TEMP/kde-neon.gpg" "$RUNNER_TEMP/kde-neon-public.key"
          sudo install -m 0644 "$RUNNER_TEMP/kde-neon.gpg" /etc/apt/keyrings/kde-neon.gpg
          echo "deb [signed-by=/etc/apt/keyrings/kde-neon.gpg] https://archive.neon.kde.org/user noble main" \
            | sudo tee /etc/apt/sources.list.d/kde-neon.list >/dev/null
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y \
            build-essential \
            cmake \
            extra-cmake-modules \
            kf6-kirigami-dev \
            kf6-kio-dev \
            kf6-qqc2-desktop-style \
            libgl1-mesa-dev \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-tools-dev \
            wget

      - name: Verify Qt installation
        run: |
          qmake6 --version

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Download linuxdeploy
        run: |
          mkdir -p packaging/linuxdeploy

          wget -O packaging/linuxdeploy/linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage

          wget -O packaging/linuxdeploy/linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage

          chmod +x packaging/linuxdeploy/*.AppImage

      - name: Build AppImage
        run: |
          chmod +x packaging/appimage.sh
          ./packaging/appimage.sh

      - name: Smoke test in clean Ubuntu (no system Qt or KDE)
        run: |
          docker run --rm \
            -v "$PWD:/work:ro" \
            ubuntu:24.04 bash -ec '
              apt-get update
              # libOpenGL.so.0 is provided separately from libGL.so.1 on Ubuntu.
              apt-get install -y --no-install-recommends libgl1 libopengl0 libegl1 libxkbcommon0 libfontconfig1 libharfbuzz0b libdbus-1-3 fonts-dejavu-core
              export APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software
              status=0
              timeout 30s /work/MMZScriptEditor.AppImage --smoke-test || status=$?
              if [ "$status" -ne 0 ]; then
                echo "AppImage startup failed (exit $status). Executable dependencies:"
                LD_LIBRARY_PATH=/work/packaging/AppDir/usr/lib \
                  ldd /work/packaging/AppDir/usr/bin/MMZScriptEditor || true
                exit "$status"
              fi
            '

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: AppImage
          path: MMZScriptEditor.AppImage
          if-no-files-found: error

      - name: Attach AppImage to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" MMZScriptEditor.AppImage --clobber

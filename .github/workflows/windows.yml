name: Build Windows

on:
  push:
    branches:
      - main
      - kirigami
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-extra-cmake-modules
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-kirigami

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package application
        run: bash packaging/windows.sh

      - name: Smoke test packaged application
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          'QML_IMPORT_PATH', 'QML2_IMPORT_PATH', 'QT_PLUGIN_PATH', 'QT_QPA_PLATFORM_PLUGIN_PATH' | ForEach-Object {
            Remove-Item "Env:$_" -ErrorAction SilentlyContinue
          }
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_QUICK_BACKEND = 'software'
          $env:QT_DEBUG_PLUGINS = '1'
          $env:QT_FORCE_STDERR_LOGGING = '1'
          $logDir = New-Item -ItemType Directory -Force -Path "$PWD/build/windows-smoke-logs"
          try {
            $app = Start-Process -FilePath "$PWD/build/windows-package/MMZScriptEditor.exe" -ArgumentList '--smoke-test' -PassThru -RedirectStandardOutput "$logDir/stdout.log" -RedirectStandardError "$logDir/stderr.log"
            if (-not $app.WaitForExit(30000)) {
              $app.Kill()
              $app.WaitForExit()
              throw 'Packaged application did not exit within 30 seconds.'
            }
            $app.WaitForExit()
            if ($app.ExitCode -ne 0) {
              throw "Packaged application failed with exit code $($app.ExitCode)."
            }
          }
          finally {
            Get-ChildItem "$logDir/*.log" | ForEach-Object {
              Write-Host "--- $($_.Name) ---"
              Get-Content $_.FullName
            }
          }

      - name: Upload smoke test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-smoke-logs
          path: build/windows-smoke-logs/
          if-no-files-found: ignore

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: MMZScriptEditor-Windows-x64
          path: build/windows-package/
          if-no-files-found: error
